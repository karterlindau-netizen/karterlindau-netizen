<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Fractals</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(21, 29, 49, .82);
      --panel-solid: #151d31;
      --text: #f5f7ff;
      --muted: #aab4ca;
      --line: rgba(255,255,255,.11);
      --accent: #9b8cff;
      --accent-2: #62d6c8;
      --danger: #ff7e91;
      --shadow: 0 24px 70px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(900px 550px at 12% -8%, rgba(111,91,220,.25), transparent 65%),
        radial-gradient(750px 500px at 95% 18%, rgba(58,187,177,.13), transparent 62%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      backdrop-filter: blur(18px);
      background: rgba(11,16,32,.78);
      border-bottom: 1px solid var(--line);
    }
    .nav-wrap {
      max-width: 1160px; margin: auto; padding: 15px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: -.03em; }
    .brand-mark {
      width: 35px; height: 35px; border-radius: 12px;
      display: grid; place-items: center; color: #111827; font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 7px 22px rgba(155,140,255,.25);
    }
    nav { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    .nav-link {
      color: var(--muted); padding: 9px 14px; border-radius: 999px;
      font-size: .92rem; font-weight: 650; transition: .2s ease;
    }
    .nav-link:hover, .nav-link.active { color: var(--text); background: rgba(255,255,255,.1); }
    main { max-width: 1160px; margin: auto; padding: 58px 24px 80px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; color: #c8c0ff;
      background: rgba(155,140,255,.12); border: 1px solid rgba(155,140,255,.24);
      border-radius: 999px; padding: 7px 12px; font-size: .78rem;
      text-transform: uppercase; letter-spacing: .12em; font-weight: 800;
    }
    h1 { font-size: clamp(2.7rem, 7vw, 5.4rem); line-height: .98; letter-spacing: -.065em; margin: 22px 0 18px; }
    h1 .gradient { background: linear-gradient(100deg, #c6bdff, #7de5d8); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lead { color: var(--muted); font-size: 1.1rem; line-height: 1.7; max-width: 650px; }
    .hero { padding: 28px 0 44px; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin: 28px 0 18px; }
    h2 { font-size: 1.65rem; letter-spacing: -.04em; margin: 0; }
    .section-note { color: var(--muted); font-size: .92rem; margin-top: 7px; }
    .people-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .person-card {
      position: relative; overflow: hidden; min-height: 235px; padding: 25px;
      border: 1px solid var(--line); border-radius: 23px;
      background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
      box-shadow: var(--shadow); transition: transform .22s ease, border-color .22s ease;
    }
    .person-card:hover { transform: translateY(-5px); border-color: rgba(190,180,255,.5); }
    .person-card::after {
      content: ""; position: absolute; width: 190px; height: 190px; border-radius: 50%;
      right: -75px; bottom: -95px; background: var(--glow); filter: blur(2px); opacity: .22;
    }
    .person-card .initial {
      width: 54px; height: 54px; display: grid; place-items: center; border-radius: 18px;
      font-size: 1.25rem; font-weight: 850; color: #101525; background: var(--glow);
      margin-bottom: 28px;
    }
    .person-card h3 { font-size: 1.6rem; margin: 0 0 8px; letter-spacing: -.04em; }
    .person-card p { margin: 0; color: var(--muted); line-height: 1.55; max-width: 230px; }
    .arrow { position: absolute; right: 23px; top: 25px; color: var(--muted); font-size: 1.3rem; }
    .home-preview {
      display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 22px;
    }
    .info-panel {
      border: 1px solid var(--line); border-radius: 22px; padding: 23px;
      background: var(--panel);
    }
    .info-panel h3 { margin: 0 0 8px; font-size: 1.05rem; }
    .info-panel p { color: var(--muted); line-height: 1.6; margin: 0; font-size: .94rem; }
    .person-header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 32px; }
    .person-header h1 { margin-bottom: 12px; }
    .person-header .lead { max-width: 590px; }
    .dropzone strong { display: block; color: var(--text); margin-bottom: 5px; }
    .dropzone small { font-size: .83rem; }
    .gallery-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 30px 0 15px; }
    .count { color: var(--muted); font-size: .9rem; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 17px; }
    .photo-card {
      position: relative; overflow: hidden; border: 1px solid var(--line);
      border-radius: 17px; background: var(--panel-solid); min-height: 190px;
      box-shadow: 0 12px 35px rgba(0,0,0,.18);
    }
    .photo-card img { display: block; width: 100%; height: 255px; object-fit: cover; transition: transform .35s ease; }
    .photo-card:hover img { transform: scale(1.035); }
    .photo-card.image-missing { min-height: 255px; }
    .photo-card.image-missing img { object-fit: contain; padding: 24px; background: #202a40; }
    .photo-caption {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 11px 12px; color: var(--muted); font-size: .82rem;
    }
    .photo-caption span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .delete-btn {
      flex: 0 0 auto; border: 1px solid rgba(255,126,145,.25); color: #ff9aaa;
      background: rgba(255,126,145,.08); border-radius: 8px; padding: 5px 8px;
      cursor: pointer; font-size: .75rem; font-weight: 700;
    }
    .empty {
      grid-column: 1/-1; border: 1px dashed var(--line); border-radius: 18px;
      padding: 55px 20px; text-align: center; color: var(--muted);
    }
    .empty .empty-icon { font-size: 2rem; margin-bottom: 10px; }
    .empty strong { display: block; color: var(--text); margin-bottom: 6px; }
    footer { max-width: 1160px; margin: auto; padding: 0 24px 30px; color: #77839d; font-size: .82rem; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
      opacity: 0; pointer-events: none; padding: 11px 16px; border-radius: 12px;
      background: #e8fff9; color: #10251f; font-weight: 750; box-shadow: var(--shadow);
      transition: .25s ease; z-index: 30;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 760px) {
      .nav-wrap { align-items: flex-start; flex-direction: column; gap: 12px; }
      nav { justify-content: flex-start; }
      main { padding-top: 38px; }
      .people-grid { grid-template-columns: 1fr; }
      .person-card { min-height: 190px; }
      .home-preview { grid-template-columns: 1fr; }
      .person-header { align-items: flex-start; flex-direction: column; }
      .gallery { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .photo-card img { height: 210px; }
    }
    @media (max-width: 470px) {
      .nav-wrap { padding-inline: 16px; }
      main { padding-inline: 16px; }
      footer { padding-inline: 16px; }
      .nav-link { padding: 8px 11px; font-size: .85rem; }
      .gallery { grid-template-columns: 1fr; }
      .photo-card img { height: 250px; }
      .section-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="nav-wrap">
      <a class="brand" href="#home" aria-label="Fractals Home">
        <span class="brand-mark">✦</span><span>Fractals</span>
      </a>
      <nav aria-label="Main navigation">
        <a class="nav-link" href="#home" data-page="home">Home</a>
        <a class="nav-link" href="#frankie" data-page="frankie">Frankie</a>
        <a class="nav-link" href="#karter" data-page="karter">Karter</a>
        <a class="nav-link" href="#berkley" data-page="berkley">Berkley</a>
      </nav>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>
  <footer>Proudly Vibe Coded with the assitance of the big g.</footer>
  <div class="toast" id="toast" role="status"></div>

  <script>
    // Add or remove pictures by editing the arrays below.
    // Put your image files in an "images" folder beside this HTML file.
    const PEOPLE = {
      frankie: {
        name: "Frankie", initial: "F", glow: "#b9a9ff",
        subtitle: "Frankie's photo collection",
        photos: ["images/frankie1.jpg", "images/frankie2.jpg", "images/frankie3.jpg"]
      },
      karter: {
        name: "Karter", initial: "K", glow: "#7de5d8",
        subtitle: "Karter's photo collection",
        photos: ["images/karter1.png", "images/karter2.png", "images/karter3.png"]
      },
      berkley: {
        name: "Berkley", initial: "B", glow: "#ffbd91",
        subtitle: "Berkley's photo collection",
        photos: ["images/berkley1.png", "images/berkley2.png", "images/berkley3.png"]
      }
    };

    function currentPage() {
      const page = location.hash.replace("#", "").toLowerCase();
      return Object.prototype.hasOwnProperty.call(PEOPLE, page) ? page : "home";
    }

    function updateNav(page) {
      document.querySelectorAll(".nav-link").forEach(link => {
        const active = link.dataset.page === page;
        link.classList.toggle("active", active);
        if (active) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });
    }

    function renderHome() {
      const cards = Object.entries(PEOPLE).map(([key, person]) => `
        <a class="person-card" href="#${key}" style="--glow:${person.glow}">
          <span class="arrow" aria-hidden="true">↗</span>
          <div class="initial">${person.initial}</div>
          <h3>${person.name}</h3>
          <p>Open ${person.name}'s page and explore their photo gallery.</p>
        </a>
      `).join("");

      document.getElementById("app").innerHTML = `
        <section class="hero">
          <span class="eyebrow">✦ A place for our fractals.</span>
          <h1>Welcome to<br><span class="gradient">our Fractal Gallery.</span></h1>
          <p class="lead">Click on one of our names to view out fractals! .</p>
        </section>
        <section>
          <div class="section-head">
            <div><h2>Meet the pages</h2><div class="section-note">Choose whose gallery you want to visit.</div></div>
          </div>
          <div class="people-grid">${cards}</div>
        </section>
        <section class="home-preview">
                  </section>
      `;
    }

    function renderPerson(key) {
      const person = PEOPLE[key];
      const cards = person.photos.map((src, index) => `
        <article class="photo-card">
          <img src="${src}" alt="${person.name} — picture ${index + 1}" loading="lazy"
               onerror="this.closest('.photo-card').classList.add('image-missing'); this.alt='Image not found: ${src}'">
          <div class="photo-caption"><span>Picture ${index + 1}</span></div>
        </article>
      `).join("");

      document.getElementById("app").innerHTML = `
        <section class="person-header">
          <div>
            <span class="eyebrow">✦ Personal gallery</span>
            <h1><span class="gradient">${person.name}.</span></h1>
            <p class="lead">${person.subtitle}.</p>
          </div>
        </section>
        <section>
          <div class="gallery-top">
            <div><h2>Photo gallery</h2></div>
            <span class="count">${person.photos.length} ${person.photos.length === 1 ? "picture" : "pictures"}</span>
          </div>
          <div class="gallery">
            ${cards || '<div class="empty"><div class="empty-icon">▧</div><strong>No pictures added yet</strong>Add image paths to this person’s photos list in the PEOPLE section of the code.</div>'}
          </div>
        </section>
      `;
    }

    function render() {
      const page = currentPage();
      updateNav(page);
      if (page === "home") renderHome();
      else renderPerson(page);
    }

    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
